networks:
  court-pipeline-net:
    driver: bridge

services:
  # --- DATABASE ---
  postgres:
    image: postgres:15
    container_name: pipeline_postgres
    environment:
      POSTGRES_USER: court_user
      POSTGRES_PASSWORD: court_password
      POSTGRES_DB: court_docket_db
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
    ports:
      - "5432:5432"
    networks:
      - court-pipeline-net
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 768m

  # --- STREAMING (KAFKA) ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: pipeline_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - court-pipeline-net

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: pipeline_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
    networks:
      - court-pipeline-net
    mem_limit: 1g
    

  # --- COMPUTE (SPARK) ---
  spark-master:
    image: apache/spark:3.5.1
    container_name: pipeline_spark_master
    environment:
      - SPARK_MODE=master
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - court-pipeline-net
    volumes:
      - ./scripts:/opt/spark/work-dir/scripts
      - ./data:/opt/spark/work-dir/data
      - ./spark-checkpoints:/tmp/spark_checkpoint_court
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master

  spark-worker:
    dns:
      - 8.8.8.8
    image: apache/spark:3.5.1
    container_name: pipeline_spark_worker
    environment:
      - SPARK_MODE=worker
    depends_on:
      - spark-master
    networks:
      - court-pipeline-net
    volumes:
      - ./data:/opt/spark/work-dir/data
      - ./scripts:/opt/spark/work-dir/scripts
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    
  # --- ORCHESTRATION (AIRFLOW) ---
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pipeline_airflow_init
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://court_user:court_password@pipeline_postgres/court_docket_db
    command: >
      bash -c "airflow db init && 
      airflow users create --username admin --password admin --firstname Court --lastname Admin --role Admin --email admin@court.com"
    depends_on:
      - postgres
    networks:
      - court-pipeline-net
    volumes:
      - ./data:/opt/airflow/data

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pipeline_airflow_webserver
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://court_user:court_password@pipeline_postgres/court_docket_db
      - AIRFLOW__WWW__DEFAULT_UI_TIMEZONE=Asia/Kolkata
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8085:8080"
    volumes:
      - ./data:/opt/airflow/data
      - ./airflow/dags:/opt/airflow/dags
      - /var/run/docker.sock:/var/run/docker.sock
      - ./airflow/logs:/opt/airflow/logs
      - ./scripts:/opt/airflow/scripts
    command: webserver
    networks:
      - court-pipeline-net

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pipeline_airflow_scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://court_user:court_password@pipeline_postgres/court_docket_db
    volumes:
      - ./data:/opt/airflow/data
      - ./airflow/dags:/opt/airflow/dags
      - /var/run/docker.sock:/var/run/docker.sock
      - ./airflow/logs:/opt/airflow/logs
      - ./scripts:/opt/airflow/scripts
      - ./data/ml_outputs:/opt/airflow/data/ml_outputs
    command: scheduler
    networks:
      - court-pipeline-net
    mem_limit: 8g
  
  metabase:
    image: metabase/metabase:latest
    container_name: pipeline_metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: h2
    networks:
      - court-pipeline-net
    depends_on:
      - postgres

volumes:
  postgres_data: